<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" rx="30" fill="url(#bgGrad)" />
  
  <!-- Glow behind QR -->
  <circle cx="200" cy="180" r="120" fill="none" stroke="#FF00FF" stroke-width="1" opacity="0.15" />
  <circle cx="200" cy="180" r="100" fill="none" stroke="#FF00FF" stroke-width="1" opacity="0.1" />
  
  <!-- QR Code pattern (simplified) -->
  <!-- Outer frame -->
  <rect x="80" y="60" width="240" height="240" rx="8" fill="none" stroke="#FF00FF" stroke-width="2" opacity="0.3" />
  
  <!-- QR Code modules - top-left finder pattern -->
  <rect x="95" y="75" width="50" height="50" rx="6" fill="#FF00FF" opacity="0.7" />
  <rect x="100" y="80" width="40" height="40" rx="4" fill="#1a0a2e" />
  <rect x="108" y="88" width="24" height="24" rx="3" fill="#FF00FF" opacity="0.7" />
  
  <!-- QR Code modules - top-right finder pattern -->
  <rect x="255" y="75" width="50" height="50" rx="6" fill="#FF00FF" opacity="0.7" />
  <rect x="260" y="80" width="40" height="40" rx="4" fill="#1a0a2e" />
  <rect x="268" y="88" width="24" height="24" rx="3" fill="#FF00FF" opacity="0.7" />
  
  <!-- QR Code modules - bottom-left finder pattern -->
  <rect x="95" y="235" width="50" height="50" rx="6" fill="#FF00FF" opacity="0.7" />
  <rect x="100" y="240" width="40" height="40" rx="4" fill="#1a0a2e" />
  <rect x="108" y="248" width="24" height="24" rx="3" fill="#FF00FF" opacity="0.7" />
  
  <!-- QR data modules (random pattern) -->
  <rect x="155" y="75" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="175" y="75" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="195" y="75" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="215" y="75" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="235" y="75" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  
  <rect x="155" y="95" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="175" y="95" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="215" y="95" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="235" y="95" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  
  <rect x="155" y="115" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="195" y="115" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="215" y="115" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  
  <rect x="155" y="135" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="175" y="135" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="195" y="135" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="235" y="135" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  
  <rect x="155" y="155" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="175" y="155" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="215" y="155" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="235" y="155" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  
  <rect x="155" y="175" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="195" y="175" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="215" y="175" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="235" y="175" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  
  <rect x="155" y="195" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="175" y="195" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="195" y="195" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="215" y="195" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  
  <rect x="155" y="215" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="175" y="215" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="195" y="215" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="235" y="215" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  
  <rect x="155" y="235" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="175" y="235" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="215" y="235" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  <rect x="235" y="235" width="10" height="10" fill="#00D9FF" opacity="0.6" />
  
  <!-- Sad eyes on QR code -->
  <ellipse cx="170" cy="145" rx="12" ry="8" fill="#1a0a2e" />
  <ellipse cx="230" cy="145" rx="12" ry="8" fill="#1a0a2e" />
  
  <!-- Sad mouth -->
  <path d="M 175 175 Q 200 160 225 175" fill="none" stroke="#1a0a2e" stroke-width="3" stroke-linecap="round" />
  
  <!-- Tears -->
  <ellipse cx="158" cy="160" rx="4" ry="7" fill="url(#tearGrad)" opacity="0.8">
    <animate attributeName="cy" values="160;185;160" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
  </ellipse>
  <ellipse cx="242" cy="160" rx="4" ry="7" fill="url(#tearGrad)" opacity="0.8">
    <animate attributeName="cy" values="160;185;160" dur="2.3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2.3s" repeatCount="indefinite" />
  </ellipse>
  
  <!-- More tears streaming down -->
  <ellipse cx="162" cy="175" rx="3" ry="5" fill="url(#tearGrad)" opacity="0.5">
    <animate attributeName="cy" values="175;200;175" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.5s" repeatCount="indefinite" />
  </ellipse>
  <ellipse cx="238" cy="175" rx="3" ry="5" fill="url(#tearGrad)" opacity="0.5">
    <animate attributeName="cy" values="175;200;175" dur="2.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.8s" repeatCount="indefinite" />
  </ellipse>
  
  <!-- Small tear drops -->
  <circle cx="155" cy="170" r="2.5" fill="#00D9FF" opacity="0.6">
    <animate attributeName="cy" values="170;195;170" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0;0.6" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="245" cy="170" r="2.5" fill="#00D9FF" opacity="0.6">
    <animate attributeName="cy" values="170;195;170" dur="2.1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.1s" repeatCount="indefinite" />
  </circle>
</svg>
